name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  UV_VERSION: "0.11.28"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install exact development and build dependencies
        run: |
          python -m pip install "uv==${UV_VERSION}"
          python scripts/verify_dependency_artifacts.py --check-lock
          python -m pip install --require-hashes --no-deps -r requirements/dev.lock
          python -m pip install --require-hashes --no-deps -r requirements/build.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check

      - name: Type check critical surfaces and monotonic repository baseline
        env:
          TRUSTED_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/verify_type_gate.py --base "${TRUSTED_BASE_SHA}"

      - name: Lint
        run: ruff check forge_cli/ tests/

      - name: Compile
        run: python -m compileall forge_cli tests scripts

      - name: Test
        run: pytest tests/ -v

  dependency-security:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify locks and build the deployable wheel
        shell: bash
        run: |
          python -m pip install "uv==${UV_VERSION}"
          python scripts/verify_dependency_artifacts.py --check-lock
          build_runtime="${RUNNER_TEMP}/forge-build"
          python -m venv --without-pip "${build_runtime}"
          if [ "${RUNNER_OS}" = "Windows" ]; then
            build_python="${build_runtime}/Scripts/python.exe"
          else
            build_python="${build_runtime}/bin/python"
          fi
          uv pip install --python "${build_python}" --require-hashes --no-deps -r requirements/build.lock
          "${build_python}" scripts/verify_dependency_artifacts.py --check-environment build
          "${build_python}" -m build --wheel --no-isolation

      - name: Prove clean install parity for every deployable surface
        shell: bash
        run: |
          for surface in core mcp anthropic openai; do
            runtime="${RUNNER_TEMP}/forge-${surface}"
            smoke_root="${RUNNER_TEMP}/forge-${surface}-smoke"
            data_root="${RUNNER_TEMP}/forge-${surface}-data"
            # Keep pip only as explicit bootstrap tooling; parity validation excludes
            # bootstrap packages and requires every application package to match the lock.
            python -m venv "${runtime}"
            mkdir -p "${smoke_root}" "${data_root}"
            if [ "${RUNNER_OS}" = "Windows" ]; then
              runtime_python="${runtime}/Scripts/python.exe"
              runtime_forge="${runtime}/Scripts/forge.exe"
            else
              runtime_python="${runtime}/bin/python"
              runtime_forge="${runtime}/bin/forge"
            fi
            uv pip install --python "${runtime_python}" --require-hashes --no-deps -r "requirements/${surface}.lock"
            uv pip install --python "${runtime_python}" --no-deps dist/forge_cli-*.whl
            uv pip check --python "${runtime_python}"
            "${runtime_python}" scripts/verify_dependency_artifacts.py --check-environment "${surface}"
            case "${surface}" in
              core)
                if [ "${RUNNER_OS}" = "Windows" ]; then
                  (cd "${smoke_root}" && "${runtime_forge}" --help >/dev/null)
                else
                  (cd "${smoke_root}" && FORGE_DATA_ROOT="${data_root}" "${runtime_forge}" list >/dev/null)
                fi
                ;;
              mcp)
                if [ "${RUNNER_OS}" = "Windows" ]; then
                  (cd "${smoke_root}" && "${runtime_python}" -c "from forge_cli.mcp_server import forge_schema; assert 'severity_levels' in forge_schema()")
                else
                  (cd "${smoke_root}" && FORGE_DATA_ROOT="${data_root}" "${runtime_python}" -c "from forge_cli.mcp_server import forge_list, forge_log; result = forge_log(project='ci', agent='wheel-smoke', severity='functional', failure_type='integration_failure', expected_behavior='packaged runtime works', actual_behavior='packaged runtime works'); assert result.startswith('Incident logged:'); assert 'Found 1 incident' in forge_list()")
                  (cd "${smoke_root}" && FORGE_DATA_ROOT="${data_root}" "${runtime_forge}" analyze --prepare-only >/dev/null)
                fi
                ;;
              anthropic)
                (cd "${smoke_root}" && ANTHROPIC_API_KEY="ci-offline-key" "${runtime_python}" -c "from forge_cli.providers import AnthropicProvider; assert AnthropicProvider(model='ci-offline').model == 'ci-offline'")
                ;;
              openai)
                (cd "${smoke_root}" && OPENAI_API_KEY="ci-offline-key" "${runtime_python}" -c "from forge_cli.providers import OpenAIProvider; assert OpenAIProvider(model='ci-offline').model == 'ci-offline'")
                ;;
            esac
          done

      - name: Install exact audit tools in an isolated environment
        shell: bash
        run: |
          audit_runtime="${RUNNER_TEMP}/forge-audit"
          python -m venv --without-pip "${audit_runtime}"
          if [ "${RUNNER_OS}" = "Windows" ]; then
            audit_python="${audit_runtime}/Scripts/python.exe"
          else
            audit_python="${audit_runtime}/bin/python"
          fi
          uv pip install --python "${audit_python}" --require-hashes --no-deps -r requirements/audit-tools.lock
          "${audit_python}" scripts/verify_dependency_artifacts.py --check-environment audit-tools
          echo "AUDIT_PYTHON=${audit_python}" >> "${GITHUB_ENV}"

      - name: Generate and validate deterministic artifact-bound SBOMs
        shell: bash
        run: |
          mkdir -p output/sbom-first output/sbom-second
          wheel_path="$(find dist -maxdepth 1 -name 'forge_cli-*.whl' -print -quit)"
          "${AUDIT_PYTHON}" scripts/verify_dependency_artifacts.py --generate-sboms output/sbom-first --wheel "${wheel_path}"
          "${AUDIT_PYTHON}" scripts/verify_dependency_artifacts.py --generate-sboms output/sbom-second --wheel "${wheel_path}"
          diff -ru output/sbom-first output/sbom-second
          mv output/sbom-first output/sbom
          rm -rf output/sbom-second
          "${AUDIT_PYTHON}" scripts/verify_dependency_artifacts.py --validate-sboms output/sbom

      - name: Audit every exact deployment set
        shell: bash
        run: |
          mkdir -p output/audit
          audit_status=0
          for surface in core mcp anthropic openai; do
            "${AUDIT_PYTHON}" -m pip_audit \
              --strict \
              --progress-spinner off \
              --disable-pip \
              --no-deps \
              --format json \
              --output "output/audit/${surface}.json" \
              -r "requirements/${surface}.lock" || audit_status=1
          done
          exit "${audit_status}"

      - name: Upload dependency evidence and wheel
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: forge-dependency-evidence-${{ runner.os }}-py${{ matrix.python-version }}
          if-no-files-found: warn
          retention-days: 90
          path: |
            dist/forge_cli-*.whl
            output/audit/*.json
            output/sbom/*.json
            requirements/*.lock
            requirements/rollback/*.json
            uv.lock
